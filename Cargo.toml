[workspace]
resolver = "2"
members = ["crates/ferrolys", "crates/ferrolys-core"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Ferrolys contributors"]
description = "Fast, honest, privacy-first open-source Minecraft launcher"
readme = "README.md"

[workspace.dependencies]
# UI
slint = "1.18"
slint-build = "1.18"

# Async / network
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "stream"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Misc
thiserror = "2"
anyhow = "1"
dirs = "6"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = "3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# i18n / theme
rust-i18n = "4"
material-colors = "0.5"
fontdb = "0.23"

# Dev / test
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
